name: CI

# Final-submission mode (02.08): the organizers' repository does not start jobs,
# while the personal mirror has a limited Actions budget. The last full gate was
# green; documentation and cloud-link pushes must not spend another ROS/Gazebo run.
# A team member can still start the complete gate explicitly when needed.
on:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  colcon-build:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Build ROS msg package
        shell: bash
        run: |
          apt-get update && apt-get install -y python3-colcon-common-extensions
          source /opt/ros/humble/setup.bash
          colcon build --packages-select ros_msgs --event-handlers console_direct+

      # the plain pytest job exercises cv2 from requirements.txt but skips rclpy;
      # this one runs the FULL suite so node-level tests are exercised on every push
      - name: Node and geometry tests (rclpy + cv2)
        shell: bash
        run: |
          apt-get install -y python3-pytest python3-numpy python3-scipy python3-opencv python3-pip
          # --no-deps: keep the apt numpy/scipy that cv2 and rclpy are built against.
          # -c: and therefore trimesh must be the version that PAIRS with numpy 1.x.
          # Unpinned, this step installed whatever was newest: trimesh 5.0.0 (released
          # 2026-08-01 00:05 UTC) types NDArray as ndarray[tuple[int], dtype[DType]],
          # which numpy 1.x cannot subscript — every test failed at COLLECTION, 90
          # minutes after the release, on a commit that touched none of this. Reusing
          # the deployment lock instead of writing "4.12.2" here on purpose: a second
          # hand-written copy of a version is how these two numbers drift apart.
          pip3 install --no-deps -c docker/pip-constraints.txt trimesh
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build ROS + Gazebo runtime image
        run: docker build -t ozon-e2e -f docker/Dockerfile .

      - name: Full contour and occupied E-stop smokes
        run: |
          docker run --name ozon-e2e-run --network host --shm-size=1g \
            -v "$GITHUB_WORKSPACE:/ws" ozon-e2e bash scripts/ci_e2e.sh

      - name: Collect simulator logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          docker cp ozon-e2e-run:/tmp/gz_e2e.log ci-logs/ 2>/dev/null || true
          docker cp ozon-e2e-run:/tmp/skeleton_e2e.log ci-logs/ 2>/dev/null || true
          mkdir -p ci-logs/estop
          docker cp ozon-e2e-run:/tmp/estop_stream_e2e/gazebo.log ci-logs/estop/ 2>/dev/null || true
          docker cp ozon-e2e-run:/tmp/estop_stream_e2e/skeleton.log ci-logs/estop/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-logs
          path: ci-logs/
