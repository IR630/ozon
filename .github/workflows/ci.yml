name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  colcon-build:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Build ROS msg package
        shell: bash
        run: |
          apt-get update && apt-get install -y python3-colcon-common-extensions
          source /opt/ros/humble/setup.bash
          colcon build --packages-select ros_msgs --event-handlers console_direct+

      # the plain pytest job skips rclpy/cv2 tests (no ROS there); this one
      # runs the FULL suite so node-level tests are exercised on every push
      - name: Node and geometry tests (rclpy + cv2)
        shell: bash
        run: |
          apt-get install -y python3-pytest python3-numpy python3-scipy python3-opencv python3-pip
          # --no-deps: keep the apt numpy/scipy that cv2 and rclpy are built against
          pip3 install --no-deps trimesh
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q
